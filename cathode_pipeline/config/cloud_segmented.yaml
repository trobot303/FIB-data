# =============================================================================
# Cloud session run (4 CPU cores, 15 GB RAM, no GPU) on the random-forest
# segmented volumes.  data/segmented/<sample>/labels_stack.tif (pushed from the
# workstation with scripts/push_label_stacks.bat) is split into pores/LCO/LLZTO
# .tiff with scripts/labels_to_masks.py.  Derived from workstation_segmented.yaml;
# differences: paths, n_workers 4, device cpu, tortuosity.downsample 4, four
# samples sharing one analysis volume (Z = LCO60_2 slice count).
# =============================================================================
schema_version: 1

project:
  name: lco_llzto_cloud_segmented
  description: "RF-segmented LCO50, LCO60, LCO60_2, LCO70; identical analysis volume; pores = volume fraction only"

paths:
  data_root: "../../data/segmented"           # <sample>/pore_stack.tif, LCO_stack.tif, LLZTO_stack.tif (255 = phase)
  output_root: "../../results_pipeline"
  log_dir: "../../results_pipeline/logs"

runtime:
  log_level: INFO
  n_workers: 4
  device: cpu
  memory_log: true
  label_format: npy
  random_seed: 0

voxel:
  size_nm: 50.0
  through_thickness_axis: y       # image rows: collector side at the top (y_min), separator side at the bottom
  current_collector_face: min

analysis_volume:
  shape_zyx: [700, 700, 1700]     # <- Z = slice count of the LCO60_2 stack (cropvol report); all crops below must span it
  enforce: true

samples:
  - name: LCO50
    nominal_lco_vol_fraction: 0.50
    input_dir: LCO50
    masks: {pore: pore_stack.tif, lco: LCO_stack.tif, llzto: LLZTO_stack.tif}
    slice_range: [null, null]
    crop: {z: [0, 700], y: [0, 700], x: [0, 1700]}
    downsample: 1
    overrides: {}

  - name: LCO60
    nominal_lco_vol_fraction: 0.60
    input_dir: LCO60
    masks: {pore: pore_stack.tif, lco: LCO_stack.tif, llzto: LLZTO_stack.tif}
    slice_range: [null, null]
    crop: {z: [0, 700], y: [0, 700], x: [1, 1701]}    # LCO60 slices are 1702 wide
    downsample: 1
    overrides: {}

  - name: LCO60_2
    nominal_lco_vol_fraction: 0.60
    input_dir: LCO60_2
    masks: {pore: pore_stack.tif, lco: LCO_stack.tif, llzto: LLZTO_stack.tif}
    slice_range: [null, null]
    crop: {z: [0, 700], y: [0, 700], x: [0, 1700]}
    downsample: 1
    overrides: {}

  - name: LCO70
    nominal_lco_vol_fraction: 0.70
    input_dir: LCO70
    masks: {pore: pore_stack.tif, lco: LCO_stack.tif, llzto: LLZTO_stack.tif}
    slice_range: [null, null]
    crop: {z: [0, 700], y: [0, 700], x: [0, 1700]}
    downsample: 1
    overrides: {}


segmentation:
  # ---- used only for samples that provide `masks` -------------------------
  masks:
    priority: [llzto, lco, pore]  # where masks overlap, the first listed phase wins
    unassigned: majority          # majority | pore | lco | llzto  - voxels covered by no mask
    postprocess: false            # true = also run the island removal / hole filling below
  # ---- grey-level parameters below are ignored for mask samples ----------
  normalize: {method: percentile, percentiles: [0.1, 99.9], per_slice: false}
  preprocess: {filter: none, sigma: 1.0, size: 3, in_3d: true}
  thresholds: {method: multi_otsu, n_classes: 3, manual: [null, null], histogram_subsample: 8}
  intensity_order: [pore, lco, llzto]
  postprocess:
    min_object_voxels: {pore: 27, lco: 125, llzto: 125}
    fill_holes: {enabled: true, max_voxels: 1000}
    majority_filter_radius: 0
    chunk_z: 96                   # z-chunk size for the neighbour-majority fill and clean-up
    chunk_margin: 16
  qc: {overlay_slices: [0.25, 0.5, 0.75], save_histogram: false}

connectivity:
  structure: 6
  reference_faces: {lco: [collector], llzto: [separator]}   # no pore entry -> pore connectivity not analysed
  report_largest_n_clusters: 10
  save_connected_labels: true

surface:
  method: marching_cubes
  marching_cubes: {smoothing_sigma: 0.7, step_size: 1}
  voxel_faces: {correction_factor: 0.667}
  interfaces: [[lco, llzto]]                                # active interface = both sides connected
  active_requires_connected: true
  chunk_z: 48

tortuosity:
  backend: taufactor
  phases: [lco, llzto]
  directions: [y]                 # through-thickness only (current collector -> separator); add x, z if needed
  use_connected_only: true
  preserve_volume_fraction: true  # downsampling keeps each phase's volume fraction (majority vote erodes thin LLZTO necks)
  taufactor:
    convergence: 0.02             # taufactor conv_crit: max. relative flux mismatch between layers (2 %)
    max_iterations: 30000
    check_every: 1000             # log iteration / tau / speed every N iterations
    max_seconds: 7200             # stop a single solve after this wall time and report the current tau (converged=false); null = no limit
  porespy: {solver_tol: 1.0e-6}
  downsample: 4                   # CPU-only cloud session: 200 nm voxels

grains:
  phases: [lco, llzto]
  method: watershed_hmax          # snow needs porespy; watershed_hmax needs scikit-image only
  snow: {sigma: 0.4, r_max: 4}
  watershed_hmax: {h: 2.0}
  min_grain_voxels: 64
  measure: {equivalent_diameter: true, sphericity: true, n_bins_size_distribution: 40}
  downsample: 2                   # 100 nm voxels: ~11 GB RAM; downsample 1 needs ~85 GB

profiles:
  slab_thickness_um: 1.0
  quantities: [volume_fraction, connected_fraction, interface_density, grain_count]
  phases: [pore, lco, llzto]      # pore appears in volume_fraction only
  normalize_position: true

report:
  compare_with_nominal: true
  reference_values_csv: null
  figures: {format: png, dpi: 200, style: default}
  tables: {float_format: "%.4f"}

plotting:
  colors: {pore: "#1f1f1f", lco: "#d95f02", llzto: "#1b9e77"}
  sample_colors: {LCO50: "#4477aa", LCO60: "#ee6677", LCO60_2: "#aa3377", LCO70: "#228833"}
  interface_colors: {lco-llzto: "#7570b3", lco-pore: "#e6ab02", llzto-pore: "#66a61e"}
  overlay_alpha: 0.45
